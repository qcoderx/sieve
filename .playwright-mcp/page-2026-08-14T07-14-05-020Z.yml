      - generic [ref=e65]:
        - paragraph [ref=e66]:
          - link "Kubernetes" [ref=e67] [cursor=pointer]:
            - /url: /docs/concepts/overview/
          - text: ", also known as K8s, is an open source system for automating deployment, scaling, and management of containerized applications."
        - paragraph [ref=e68]:
          - text: It groups containers that make up an application into logical units for easy management and discovery. Kubernetes builds upon
          - link "15 years of experience of running production workloads at Google" [ref=e69] [cursor=pointer]:
            - /url: https://queue.acm.org/detail.cfm?id=2898444
          - text: ", combined with best-of-breed ideas and practices from the community."
      - generic [ref=e72]:
        - heading "Planet scale" [level=4] [ref=e73]
        - paragraph [ref=e74]: Designed on the same principles that allow Google to run billions of containers a week, Kubernetes can scale without increasing your operations team.
      - generic [ref=e77]:
        - heading "Never outgrow" [level=4] [ref=e78]
        - paragraph [ref=e79]: Whether testing locally or running a global enterprise, Kubernetes flexibility grows with you to deliver your applications consistently and easily no matter how complex your need is.
      - generic [ref=e82]:
