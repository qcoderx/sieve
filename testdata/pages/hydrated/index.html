<title>Kiln schedule</title>
<!--
  A page that ships its content twice: once as a framework's server-rendered
  state, and once as nothing at all.

  This is the shape of a single-page application whose render never completes.
  The document contains a loading screen and a typed JSON payload holding every
  word of the page, which is where the framework itself would read them from
  once it hydrated. It never does here, exactly as hatom.com's never does
  inside sieve's budget.

  The payload deliberately also carries the things a payload carries and an
  artifact must not fill up with: routes, asset URLs, class names, i18n keys,
  hashes, feature flags and component names. Those are the reason the harvest
  filters for prose rather than taking every string.
-->
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem; }
</style>

<!--
  An empty mount point, and nothing else. The word "Loading" is deliberately
  absent: sieve waits on a loading screen, correctly and for a long time, and
  this fixture is about the hydration payload rather than about that wait. The
  live case it stands in for -- hatom.com -- does both, and pays for both.
-->
<div id="__nuxt"></div>
