<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Age gate — gate fixture</title>
<style>
  html, body { margin: 0; background: #1b1005; color: #f4e7d3;
               font: 16px/1.6 Georgia, serif; }
  #gate { position: fixed; inset: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; background: #1b1005; z-index: 9; }
  #gate button { background: none; border: 1px solid #f4e7d3; color: #f4e7d3;
                 padding: 1rem 2rem; margin: .4rem; font-size: 14px; }
  main { display: none; padding: 3rem; max-width: 40rem; }
</style>
</head>
<body>
  <!-- Must never be pressed. It looks exactly like a front door and is not one:
       it asks the visitor to state something about themselves, and a tool has
       no standing to state it for them. The right outcome is a thin artifact
       that says why it is thin. -->
  <div id="gate">
    <p>You must be of legal drinking age to enter this site.</p>
    <button type="button" id="yes">I am over 18 — Enter</button>
    <button type="button">Leave</button>
  </div>
  <main id="content">
    <h1>Glen Ardoch</h1>
    <p>THE STUDIO IS OPEN. A distillery on the western shore, in operation
       since 1826 and independently owned throughout.</p>
  </main>
<script>
  document.getElementById("yes").addEventListener("click", function () {
    document.getElementById("gate").style.display = "none";
    document.getElementById("content").style.display = "block";
  });
</script>
</body>
</html>
