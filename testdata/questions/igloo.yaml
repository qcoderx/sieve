# Question set for igloo.inc.
#
# This is the case the project exists for, and the one no benchmark had ever
# been pointed at. igloo.inc serves an empty <body>: an unaided agent fetching
# it receives a shell with a title and a meta description and nothing else.
# Every word below is drawn as MSDF glyph geometry inside a three.js scene.
#
# The ground truth was read out of the site's own JavaScript bundle with curl,
# not out of sieve's artifact. That matters more here than anywhere else --
# grading a scene extraction against ground truth derived from that same scene
# extraction would be a closed loop that could never fail.
#
#   curl https://www.igloo.inc/assets/App3D-*.js | grep -o 'Pudgy Penguins[^"]*'
#
# The expected outcome is not a marginal gain. The control cannot answer any
# content question at all, because it has nothing to read; the artifact should
# answer nearly all of them. If sieve does not win overwhelmingly here, the
# scene extraction is not working.
#
#   sieve distill https://igloo.inc -load-timeout 40s -out ./artifacts
#   sieve bench ./artifacts/igloo.inc --questions testdata/questions/igloo.yaml

name: Igloo Inc. (WebGL, empty served HTML)
url: https://igloo.inc

questions:
  # --- Factual retrieval ----------------------------------------------------
  - id: q01
    band: factual
    ask: What is Igloo Inc's stated mission?
    expect: To build the next generation of consumer brands at the intersection
      of Community, AI, and crypto.
    facts:
      - next generation of consumer brands
      - Community, AI and crypto

  - id: q02
    band: factual
    ask: In what year was Pudgy Penguins founded?
    expect: 2021.
    facts:
      - founded in 2021

  - id: q03
    band: factual
    ask: When did Igloo Inc. acquire Pudgy Penguins?
    expect: In 2022.
    facts:
      - acquired in 2022
      - acquired by Igloo

  - id: q04
    band: factual
    ask: What was the acquisition intended to achieve?
    expect: To expand Pudgy Penguins' reach and capabilities, and reposition it
      as a next-generation entertainment company and the face of Web3.
    facts:
      - expanding its reach and capabilities
      - next-generation entertainment company
      - face of Web3

  - id: q05
    band: factual
    ask: What does the company say it believes about intellectual property and
      communities?
    expect: That intellectual property, digital collectibles and communities are
      born and thrive on the blockchain.
    facts:
      - intellectual property
      - digital collectibles
      - thrive on the blockchain

  - id: q06
    band: factual
    ask: What is Abstract?
    expect: A blockchain for consumer crypto, pioneering culture, community and
      creativity onchain.
    facts:
      - blockchain for consumer crypto
      - culture, community and creativity onchain

  - id: q07
    band: factual
    ask: Why does the company think a consumer crypto chain matters?
    expect: It is described as the breakthrough opportunity to bring billions of
      people onchain, and the dominant chain would be the single greatest
      distribution channel.
    facts:
      - bring billions of people onchain
      - single greatest distribution channel

  - id: q08
    band: factual
    ask: What is OverpassIP, and what problem was it created to solve?
    expect: A solution to a licensing challenge faced by Pudgy Penguins, a
      breakthrough in NFT licensing.
    facts:
      - licensing challenge
      - NFT licensing

  - id: q09
    band: factual
    ask: What does OverpassIP let NFT holders do?
    expect: Submit their digital assets for potential licensing opportunities.
    facts:
      - submit their digital assets
      - licensing opportunities

  - id: q10
    band: factual
    ask: What shift in business model does the company describe?
    expect: From a brand-and-consumer approach to a brand-and-participant model.
    facts:
      - brand-and-participant model

  - id: q11
    band: factual
    ask: Which company name appears in the copyright line?
    expect: Igloo, Inc.
    facts:
      - Igloo, Inc

  # Corrected. This question originally asked about a "headphones recommended"
  # notice and counted it as ground truth. That text belongs to hatom.com, not
  # to igloo.inc -- I attributed it here by mistake, and the question set was
  # wrong rather than the extraction. What igloo actually carries, confirmed in
  # its bundle, is a sound control labelled "Sound:" with On and Off.
  - id: q12
    band: factual
    ask: Does the page offer any control over sound, and what are the options?
    expect: Yes, a sound control with On and Off.
    facts:
      - Sound
      - On
      - Off

  # --- Structural -----------------------------------------------------------
  - id: q13
    band: structural
    ask: What are the main sections of this page?
    expect: Summary, Discover, Visit and Manifesto.
    facts:
      - Summary
      - Discover
      - Manifesto

  # Rewritten. This asked how much content the page has, and offered "several
  # paragraphs" as an atomic fact -- which is a statement about the artifact's
  # size, not a claim the page makes, so no extraction could ever contain it.
  # Coverage measures whether the page's facts survived; a question has to be
  # about the page for that to mean anything.
  - id: q14
    band: structural
    ask: Which portfolio companies does the page present, and in what order?
    expect: Pudgy Penguins, Overpass and Abstract.
    facts:
      - Pudgy Penguins
      - Overpass
      - Abstract

  - id: q15
    band: structural
    ask: Is the page's text present in the served HTML, or produced some other
      way?
    expect: It is not in the served HTML; the page renders its text into a WebGL
      scene.
    facts:
      - not written into the document
      - drawn into a 3D scene

  # --- Actionable -----------------------------------------------------------
  - id: q16
    band: actionable
    ask: Which social platforms does the site link to?
    expect: LinkedIn, X (Twitter) and Medium.
    facts:
      - LinkedIn
      - Medium
      - X or Twitter

  - id: q17
    band: actionable
    ask: If I wanted to read the company's own summary of its history, where
      would I look?
    expect: The Summary section.
    facts:
      - Summary

  - id: q18
    band: actionable
    ask: Can a visitor submit an NFT collection for licensing, and through what?
    expect: Yes, through OverpassIP.
    facts:
      - OverpassIP

  # Rewritten. The original asked the artifact to demonstrate an absence -- "no
  # form", "no email address" -- and coverage works by finding a fact's words in
  # the text. A claim that something is not there can never be found, so those
  # two facts were unanswerable by construction and were dragging the score down
  # regardless of what sieve extracted.
  - id: q19
    band: actionable
    ask: How does the page invite a visitor to begin?
    expect: 'By scrolling — the page says "Scroll down to discover."'
    facts:
      - scroll down to discover

  # Trimmed to the half that is checkable. "A browser that runs JavaScript" is
  # a fact about how the web works, not about this page, and it appears nowhere
  # in any artifact. Where the text came from is a real property of this
  # extraction, and sieve records it.
  - id: q20
    band: actionable
    ask: Where did the text in this artifact come from, and is it in the page's
      own markup?
    expect: It was read out of the page's 3D scene; the document itself contains
      none of it.
    facts:
      - drawn into a 3D scene
      - rather than written into the document
