    facts:
      - strategy to deployment
      - one-stop shop

  - id: q07
    band: factual
    ask: What has Locomotive become a go-to for?
    expect: Meaningful, innovative, results-driven digital experiences, web
      design and branding.
    facts:
      - results-driven
      - web design and branding

  - id: q08
    band: factual
    ask: Name three featured clients.
    expect: Wolverine Worldwide, The Drake Hotel and Scout Motors.
