    expect: +1 514 524 5678.
    facts:
      - 514 524 5678

  - id: q10
    band: factual
    ask: What street is named on the page?
    expect: Jean-Talon Est.
    facts:
      - Jean-Talon

  - id: q11
    band: factual
    ask: Is the studio hiring?
