# Hard band: a scroll-hijacked site by the people who wrote the scroll hijacker.
#
# locomotive.ca runs Locomotive Scroll, which is to say the page does not scroll;
# it transforms its own content in response to wheel events. Content arrives by
# scrolling rather than by loading, and headings are shattered into one element
# per fragment so each can be tweened -- the served markup carries
# "Digital-First", "Digital-First Design" and "Digital-First Agency" as separate
# runs of the same heading, twice over.
#
# That combination is what the sweep exists for, and it is also why the naive
# comparison here is unfair in sieve's favour unless stated: a reader that takes
# the served bytes and strips tags gets every fragment as a separate line and
# no way to tell a duplicate from a repetition the designer intended.
#
# Ground truth read from the served HTML, not from an artifact:
#
#   curl -s https://www.locomotive.ca | sed -e 's/<[^>]*>//g'
#
#   sieve distill https://www.locomotive.ca -out ./artifacts
#   sieve bench ./artifacts/locomotive.ca \
#     --questions testdata/questions/locomotive.yaml -coverage-only

name: Locomotive
url: https://www.locomotive.ca

questions:
  # --- Factual retrieval ----------------------------------------------------
  - id: q01
    band: factual
    ask: What kind of agency is this and where is it?
    expect: A digital-first design agency based in Montreal, Quebec, Canada.
    facts:
      - Montreal
      - design agency

  - id: q02
    band: factual
    ask: How does the studio describe its people?
    expect: A small group of creative thinkers.
    facts:
      - small group of creative thinkers

  - id: q03
    band: factual
    ask: What does the studio say design and code are?
    expect: Only tools of expression; what sets the work apart is people.
    facts:
      - only tools of expression
      - is people

  - id: q04
    band: factual
    ask: What does the studio craft?
    expect: Bespoke digital-first brand identities and experiences, tailor-made
      for the client and their audience.
    facts:
      - bespoke
      - brand identities
      - tailor-made

  - id: q05
    band: factual
    ask: How long has Locomotive been working?
    expect: Over the past 15 years.
    facts:
      - 15 years

  - id: q06
