  - id: q15
    band: factual
    ask: Where were the annual trips in 2024 and 2022?
    expect: Jamaica in 2024 and Playa del Carmen in 2022.
    facts:
      - 2024
      - Jamaica
      - Playa del Carmen

  - id: q16
    band: factual
    ask: What merchandise is offered?
    expect: A "Pros de l'internet" white T-shirt and sand hat.
    facts:
      - Pros de l'internet
      - Sand Hat

  # --- Structural -----------------------------------------------------------
  - id: q17
    band: structural
    ask: What is the main heading of the site?
    expect: Digital-first design agency, based in Montreal, Canada.
    facts:
      - Digital-First
      - Based in Montreal

  - id: q18
    band: structural
    ask: What sections does the home page have?
    expect: Featured work, an about statement, a journal or articles list,
      annual trips, and gear.
    facts:
      - Featured work
      - Annual trips

  # --- Actionable -----------------------------------------------------------
  - id: q19
    band: actionable
    ask: Someone wants to see the full portfolio rather than the highlights.
