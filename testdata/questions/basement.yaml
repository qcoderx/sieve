# Hard band: a WebGL studio site where the content is real but the page is not.
#
# basement.studio ships two hundred kilobytes of markup around under three
# thousand characters of prose, drives the whole thing through a 3D scene, and
# reveals its sections on scroll. The words are in the served bytes, which makes
# this a different hard case from igloo.inc: nothing here is unreadable in
# principle, it is a question of whether a reader gets the prose or the shell.
#
# Ground truth read from the served HTML, not from an artifact:
#
#   curl -s https://basement.studio | sed -e 's/<[^>]*>//g'
#
#   sieve distill https://basement.studio -out ./artifacts
#   sieve bench ./artifacts/basement.studio \
#     --questions testdata/questions/basement.yaml -coverage-only

name: basement.studio
url: https://basement.studio

questions:
  # --- Factual retrieval ----------------------------------------------------
  - id: q01
    band: factual
    ask: What kind of studio is this?
    expect: A digital studio and branding powerhouse.
    facts:
      - digital studio
      - branding

  - id: q02
    band: factual
    ask: Who does the studio partner with?
    expect: The world's most ambitious startups, scale-ups and brands.
    facts:
      - startups
      - scale-ups

  - id: q03
    band: factual
    ask: Through what convergence does the studio say it unlocks growth?
    expect: The convergence of creativity, design and technology.
    facts:
      - creativity, design, and technology

  - id: q04
    band: factual
    ask: What does the studio say about the Vercel partnership?
    expect: It means pushing the limits of performance and innovation, crafting
      a digital ecosystem built for speed, precision and impact.
    facts:
      - Vercel
      - speed, precision, and impact

  - id: q05
    band: factual
    ask: What was the outcome of the Daylight project?
    expect: A high-performance, story-driven website that sold out inventory in
      hours.
    facts:
